name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install ffmpeg (analyze_audio tests run it on generated audio)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Syntax check
        run: node --check index.js

      - name: Run tests
        run: node --test
